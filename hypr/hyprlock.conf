# hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# ── DYNAMIC CLOCK/DATE ───────────────────────────────────────────────────────
# Clock and date have TWO versions each:
#   *_spotify  → shown when Spotify is Playing/Paused  (pulled up, stack layout)
#   *_center   → shown when Spotify is idle             (true screen center)
# Each version's cmd[] outputs the text OR an empty string, so only one
# renders at a time. Requires playerctl installed.
# Helper scripts live at ~/.local/bin/hyprlock-clock-spotify.sh etc.
# ─────────────────────────────────────────────────────────────────────────────

$font = Hack Nerd Font Propo

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.70   # ~10% darker than default
}

# ── INPUT FIELD ───────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(255, 255, 255, 0.12) rgba(255, 255, 255, 0.28) 45deg
    check_color = rgba(220, 220, 220, 0.20) rgba(180, 180, 180, 0.20) 120deg
    fail_color  = rgba(255, 100,  80, 0.20) rgba(220,  60,  60, 0.20) 40deg
    font_color  = rgb(210, 210, 210)
    fade_on_empty = false
    rounding = 4
    font_family = $font
    placeholder_text = Enter Password to Unlock
    fail_text = $PAMFAIL$FPRINTFAIL
    # check_text = Authenticating...
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3
    # hide_input = true
    position = 0, 220
    halign = center
    valign = bottom
}

# ── LOCK NOTICE ───────────────────────────────────────────────────────────────
label {
    monitor =
    text =  
    font_size = 24
    font_color = rgba(200, 200, 200, 0.45)
    font_family = $font
    position = 0, 280
    halign = center
    valign = bottom
}

#battery
label {
    # Path to your script
    monitor =
    text = cmd[update:10] bash ~/.local/bin/hyprlock--battery-stats.sh
    font_size = 25      
    font_family = JetBrainMono
    
    # Positioning (adjust as needed)
    position = -10, -10
    halign = right
    valign = top
}

# ════════════════════════════════════════════════════════════════════════════
# STATE A — SPOTIFY ACTIVE
# Full stack: clock (top) → date → cover → track label
# Math: total block ≈ 446px, centered → top at +223px from screen center
#   Clock center  = +173
#   Date  center  = +80
#   Cover center  = -75   (size 220)
#   Track center  = -211
# ════════════════════════════════════════════════════════════════════════════

# Clock — spotify active position
label {
    monitor =
    text = cmd[update:5] bash ~/.local/bin/hyprlock-clock-spotify.sh
    font_size = 90
    font_color = rgb(235, 235, 235)
    font_family = $font
    position = 0, 223
    halign = center
    valign = center
}

# Date — spotify active position
label {
    monitor =
    text = cmd[update:30] bash ~/.local/bin/hyprlock-date-spotify.sh
    font_size = 22
    font_color = rgba(210, 210, 210, 0.75)
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

# Spotify album art
image {
    monitor =
    path = ~/.local/bin/spotify-art/spotify_cover.png
    reload_time = 2
    reload_cmd = ~/.local/bin/spotify_art.sh
    size = 220
    outline_thickness = 0
    rounding = -1
    position = 0, -25
    halign = center
    valign = center
}

# Spotify track label — tight under cover (14px gap: cover bottom at -185, label center at -211)
label {
    monitor =
    size = 10%, 100%
    text = cmd[update:5] ~/.local/bin/spotify_status.sh
    font_size = 18
    font_color = rgba(210, 210, 210, 0.80)
    font_family = $font
    position = 0, -181
    halign = center
    valign = center
}

# ════════════════════════════════════════════════════════════════════════════
# STATE B — NO SPOTIFY
# Just clock + date, truly centered on screen
#   total block ≈ 158px → top at +79px
#   Clock center = +29
#   Date  center = -64
# ════════════════════════════════════════════════════════════════════════════

# Clock — no spotify, centered
label {
    monitor =
    text = cmd[update:5] bash ~/.local/bin/hyprlock-clock-nospotify.sh
    font_size = 90
    font_color = rgb(235, 235, 235)
    font_family = $font
    position = 0, 79
    halign = center
    valign = center
}

# Date — no spotify, centered
label {
    monitor =
    text = cmd[update:30] bash ~/.local/bin/hyprlock-date-nospotify.sh
    font_size = 22
    font_color = rgba(210, 210, 210, 0.75)
    font_family = $font
    position = 0, -14
    halign = center
    valign = center
}
